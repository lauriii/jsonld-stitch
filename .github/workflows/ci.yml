name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - run: npm run test:react18
      - run: npm run lint:pkg
      - name: Pack contents
        run: npm pack --dry-run

  e2e:
    name: e2e (Next ${{ matrix.next }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "16" uses the version pinned in examples/app-router; 15.5 is installed over it.
        next: ["16", "15.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_VERSION: ${{ matrix.next == '16' && '' || matrix.next }}
